<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Counter App</title>
    <!-- Linking the CSS stylesheet -->
    <link rel="stylesheet" href="code 3.css">
</head>

<body>

    <div class="card">
        <h1>Counter App</h1>
        <p class="count-display" id="counter">0</p>

        <div class="button-group">
            <button id="decrement-btn">- Subtract</button>
            <button id="reset-btn">Reset</button>
            <button id="increment-btn">+ Add</button>
        </div>
    </div>

    <!-- Linking the JavaScript file -->
    <script src="code 2.js"></script>
</body>

</html>
